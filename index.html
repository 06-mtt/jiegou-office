<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>結構事務所（原型）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#e9e4d8;color:#1f2733;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.45;overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:600px;height:100vh;height:100dvh;background:#f7f4ec;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(60,50,20,.12)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.ghost{padding:8px 12px;border-radius:10px;background:#ece7da;color:#3d4756;font-size:13px;font-weight:600;min-height:38px}
.ghost:active{background:#dfd8c6}
.primary{background:#2b6de0;color:#fff;font-weight:700;border-radius:12px;padding:12px 18px;font-size:16px;box-shadow:0 3px 0 #1b4fb0;min-height:46px}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #1b4fb0}

/* 首頁 */
#home{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#2f3b4c;color:#fff}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.brand b{font-size:18px;letter-spacing:.06em}.brand span{font-size:11px;opacity:.7}
.wallet{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;line-height:1.3;opacity:.95}
.wallet b{color:#f4d35e;font-size:13px}
.top .ghost{background:rgba(255,255,255,.14);color:#fff;font-size:12px;padding:6px 10px;min-height:32px}
.homeBody{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
.mode{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 #e3dccb}
.modeHead{display:flex;align-items:baseline;gap:8px}
.mode h2{margin:0;font-size:19px}.modeHead span{font-size:12px;color:#7a8696}
.mode p{margin:4px 0 10px;font-size:13px;color:#4b5666}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.lvbtn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px 7px;border-radius:12px;background:#f1ede2;border:1.5px solid #e2dccb;min-height:76px}
.lvbtn .num{font-size:20px;font-weight:800;color:#2f3b4c;line-height:1}
.lvbtn .nm{font-size:11.5px;color:#4b5666;white-space:nowrap}
.lvbtn .st i{font-style:normal;font-size:13px;color:#d6cfbc}.lvbtn .st i.on{color:#f2b01e}
.lvbtn.done{background:#eef6ef;border-color:#cfe6d3}
.lvbtn.locked{opacity:.42}
.lvbtn:not(.locked):active{transform:scale(.97)}
.foot{font-size:11.5px;color:#8a8472;text-align:center;margin:6px 0 0}

/* 關卡 */
#level{height:100%;display:flex;flex-direction:column}
.lvtop{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#2f3b4c;color:#fff}
.lvtop .ghost{background:rgba(255,255,255,.14);color:#fff;min-width:40px}
#back{font-size:22px;line-height:1;padding:4px 12px}
.lvname{flex:1;display:flex;flex-direction:column;line-height:1.15;min-width:0}
.lvname small{font-size:11px;opacity:.7}.lvname b{font-size:16px}
.brief{padding:8px 12px 6px;background:#fff;border-bottom:1px solid #e9e2d2}
.brief .who{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#8a6a3c;border-radius:6px;padding:1px 7px;margin-bottom:3px}
.brief p{margin:0;font-size:13.5px}
.brief .tip{font-size:12px;color:#6a7484;margin-top:3px;padding-left:8px;border-left:3px solid #f4d35e}
.stage{flex:1;min-height:150px;position:relative;background:#f3f8fd}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene text{font-family:inherit;user-select:none}
#hit{position:absolute;inset:0;touch-action:none}
#toast{position:absolute;left:10px;right:10px;bottom:8px;background:rgba(31,39,51,.93);color:#fff;font-size:13px;padding:9px 12px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:none}
.ledger{display:flex;flex-wrap:wrap;gap:2px 12px;padding:6px 12px;font-size:12px;color:#5b6676;background:#fbf9f3;border-top:1px solid #e9e2d2}
.ledger b{color:#1f2733}.ledger .pf{margin-left:auto;font-size:13px}.ledger .pf b{color:#1f7a50;font-size:15px}
.tray{padding:8px 10px 4px;background:#fbf9f3;user-select:none;-webkit-user-select:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.card{position:relative;background:#fff;border:1.5px solid #e2dccb;border-radius:12px;padding:4px 4px 5px;display:flex;flex-direction:column;align-items:center;text-align:center;touch-action:none;cursor:grab;line-height:1.2;box-shadow:0 2px 0 #e2dccb}
.card svg{width:36px;height:26px}
.card b{font-size:12px}.card i{font-style:normal;font-size:10.5px;color:#5b6676}
.card em{font-style:normal;font-size:11px;font-weight:700;color:#8a6a3c}
.card .cnt{position:absolute;top:3px;right:5px;font-size:10.5px;font-weight:700;color:#2b6de0}
.card.out{opacity:.38}
.card.tog{cursor:pointer;touch-action:manipulation}.card.sel{border-color:#2b6de0;background:#eaf1fd;box-shadow:0 2px 0 #2b6de0}
.ctlrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #e2dccb;border-radius:12px;padding:3px 4px 3px 9px;flex:1 1 150px;min-height:44px}
.stepper .lab{font-size:12px;color:#5b6676;white-space:nowrap}
.stepper .val{flex:1;text-align:center;font-weight:700;font-size:13.5px;line-height:1.15;white-space:nowrap}
.stepper .val small{display:block;font-size:10.5px;color:#8a6a3c;font-weight:700}
.stepper button{width:36px;height:36px;border-radius:9px;background:#ece7da;font-size:19px;font-weight:700;line-height:1}
.stepper button:active{background:#d9d1bd}
.forms{display:flex;gap:6px;margin-bottom:6px}
.form{flex:1;background:#fff;border:1.5px solid #e2dccb;border-radius:12px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;min-height:52px}
.form svg{width:36px;height:26px}.form b{font-size:12px}
.form.sel{border-color:#2b6de0;background:#eaf1fd;box-shadow:0 2px 0 #2b6de0}
.note{font-size:12px;color:#5b6676;padding:4px 2px}
.est{font-size:12.5px;color:#5b6676;text-align:right;padding:0 4px}.est b{font-size:15px;color:#8a6a3c}
.actions{display:flex;gap:8px;padding:6px 10px 12px;background:#fbf9f3}
.actions .primary{flex:1}
#ghost{position:fixed;display:none;transform:translate(-50%,-50%);background:#2e9e6b;color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;pointer-events:none;z-index:9;box-shadow:0 4px 10px rgba(0,0,0,.25);white-space:nowrap}

/* 結果 */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:78%;overflow-y:auto}
#sheet.on{transform:none}
.sheet{background:#fff;border-radius:18px 18px 0 0;padding:14px 16px 16px;box-shadow:0 -8px 30px rgba(30,30,20,.22)}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:4px 0;font-size:14px}
.sheet.fail h3{color:#c2333a}.sheet.fail b{color:#c2333a}
.sheet .fee{font-size:12.5px;color:#8a6a3c;font-weight:700}
.sheet.win h3{color:#1f7a50}
.stars{font-size:38px;line-height:1;letter-spacing:6px;margin:2px 0 8px}
.stars i{font-style:normal;color:#e5dfcf;display:inline-block;transition:transform .25s cubic-bezier(.3,1.8,.5,1),color .2s}
.stars i.on{color:#f2b01e;transform:scale(1.18)}
.sheet table{width:100%;border-collapse:collapse;font-size:13.5px}
.sheet td{padding:2px 0}.sheet td:last-child{text-align:right;font-weight:700}
.sheet tr.sum td{border-top:1.5px solid #e2dccb;padding-top:5px;font-size:15.5px;color:#1f7a50}
.sheet .why{font-size:12.5px;color:#5b6676}
.sheet details{font-size:12.5px;color:#3d4756;margin:6px 0}.sheet summary{color:#2b6de0;font-weight:600;padding:4px 0}
.sheet ul{margin:4px 0 0;padding-left:18px}
.btns{display:flex;gap:8px;margin-top:10px}.btns .primary{flex:1}.btns .ghost{flex:0 1 auto}
@media (max-height:640px){.brief{padding:5px 12px 4px}.brief p{font-size:13px;line-height:1.35}.brief .tip{font-size:11.5px;margin-top:2px}.brief .who{margin-bottom:1px}
  .card svg{height:20px}.card{padding:3px 4px 4px}.actions{padding:4px 10px 8px}.primary{min-height:42px;padding:9px 18px}
  .stepper{min-height:40px;flex-basis:44%}.stepper button{width:32px;height:32px}.form{min-height:46px}.form svg{height:20px}.forms,.ctlrow{margin-bottom:4px}.tray{padding:6px 10px 2px}.ledger{padding:4px 12px}.lvtop{padding:6px 10px}}

</style>
</head>
<body>
<div id="app"><div id="home"></div><div id="level" hidden></div><div id="sheet"></div></div>
<div id="ghost"></div>
<script>
// 結構事務所 規則引擎（瀏覽器與 node 共用）
(function (root) {
  'use strict';
  const EPS = 1e-7;

  // ---------- 通用靜力求解 ----------
  function gauss(A, b) {
    const n = A.length;
    const M = A.map((r, i) => r.concat([b[i]]));
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-9) return null;
      const t = M[c]; M[c] = M[p]; M[p] = t;
      for (let r = 0; r < n; r++) {
        if (r === c) continue;
        const f = M[r][c] / M[c][c];
        if (f) for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
      }
    }
    return M.map((r, i) => r[n] / r[i]);
  }

  // B 個剛體；sup:[{b,x,y,t:'R'|'P'|'F'}] hin:[{a,b,x,y}] ties:[{a,xa,ya,b,xb,yb}] loads:[{b,x,y,fx,fy}]
  function statics(B, sup, hin, ties, loads) {
    const cols = [];
    const T = (b, x, y, fx, fy, m) => ({ b, x, y, fx, fy, m: m || 0 });
    sup.forEach((s, i) => {
      if (s.t !== 'R') cols.push({ k: 'H', i, terms: [T(s.b, s.x, s.y, 1, 0)] });
      cols.push({ k: 'V', i, terms: [T(s.b, s.x, s.y, 0, 1)] });
      if (s.t === 'F') cols.push({ k: 'M', i, terms: [T(s.b, 0, 0, 0, 0, 1)] });
    });
    hin.forEach((h, i) => {
      cols.push({ k: 'hx', i, terms: [T(h.a, h.x, h.y, 1, 0), T(h.b, h.x, h.y, -1, 0)] });
      cols.push({ k: 'hy', i, terms: [T(h.a, h.x, h.y, 0, 1), T(h.b, h.x, h.y, 0, -1)] });
    });
    ties.forEach((t, i) => {
      const dx = t.xb - t.xa, dy = t.yb - t.ya, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d;
      cols.push({ k: 'T', i, terms: [T(t.a, t.xa, t.ya, ux, uy), T(t.b, t.xb, t.yb, -ux, -uy)] });
    });
    const n = cols.length, m = 3 * B;
    if (n < m) return { st: 'mech' };
    if (n > m) return { st: 'indet' };
    const A = []; const rhs = [];
    for (let r = 0; r < m; r++) { A.push(new Array(n).fill(0)); rhs.push(0); }
    cols.forEach((c, j) => c.terms.forEach(t => {
      A[3 * t.b][j] += t.fx; A[3 * t.b + 1][j] += t.fy; A[3 * t.b + 2][j] += t.x * t.fy - t.y * t.fx + t.m;
    }));
    loads.forEach(l => { rhs[3 * l.b] -= l.fx; rhs[3 * l.b + 1] -= l.fy; rhs[3 * l.b + 2] -= l.x * l.fy - l.y * l.fx; });
    const x = gauss(A, rhs);
    if (!x) return { st: 'mech' };
    return { st: 'ok', cols, x };
  }

  // ---------- 零件 ----------
  const PARTS = {
    R4:  { t: 'R', cap: 4,  price: 1, name: '滾支承', sub: '上限 4 t' },
    R8:  { t: 'R', cap: 8,  price: 2, name: '滾支承', sub: '上限 8 t' },
    R12: { t: 'R', cap: 12, price: 3, name: '滾支承', sub: '上限 12 t' },
    P4:  { t: 'P', cap: 4,  hcap: 2, price: 2, name: '鉸支承', sub: '上限 4 t・水平 2 t' },
    P8:  { t: 'P', cap: 8,  hcap: 4, price: 3, name: '鉸支承', sub: '上限 8 t・水平 4 t' },
    P12: { t: 'P', cap: 12, hcap: 8, price: 5, name: '鉸支承', sub: '上限 12 t・水平 8 t' },
    F12: { t: 'F', cap: 12, hcap: 8, mcap: 12, price: 0, name: '固定端', sub: '彎矩上限 12 t·m' },
    F20: { t: 'F', cap: 12, hcap: 8, mcap: 20, price: 0, name: '固定端', sub: '彎矩上限 20 t·m' }
  };
  const TOPS = {
    CW2: { w: 2, price: 1, name: '配重', sub: '2 t' },
    C1:  { w: 1, price: 0, req: true, name: '貨', sub: '1 t' },
    C2:  { w: 2, price: 0, req: true, name: '貨', sub: '2 t' },
    C3:  { w: 3, price: 0, req: true, name: '貨', sub: '3 t' },
    C4:  { w: 4, price: 0, req: true, name: '貨', sub: '4 t' },
    C6:  { w: 6, price: 0, req: true, name: '貨', sub: '6 t' }
  };
  const TIES = { T6: { cap: 6, price: 3, name: '拉桿', sub: '上限 6 t' }, T10: { cap: 10, price: 5, name: '拉桿', sub: '上限 10 t' } };

  // ---------- 玩法 A：放手 ----------
  function archY(lv, rise, x) {
    if (lv.shape === 'portal') return (x <= 0 || x >= lv.L) ? 0 : rise;
    return 4 * rise * x * (lv.L - x) / (lv.L * lv.L);
  }
  // st: {sup:{slot:partKey}, top:{x:topKey}, rise:idx, tie:key|null}
  function evalA(lv, st) {
    const sup = [], hin = [], ties = [], loads = [], supMeta = [];
    let cost = 0, B = 1;
    const isArch = lv.type === 'arch';
    let rise = 0;
    // 必放的貨都放了嗎
    if (lv.topTray) {
      const used = {};
      Object.keys(st.top || {}).forEach(x => { used[st.top[x]] = (used[st.top[x]] || 0) + 1; });
      for (const it of lv.topTray) if (TOPS[it.k].req && (used[it.k] || 0) < it.n) return { st: 'incomplete', why: 'cargo' };
    }
    const bodyOf = isArch ? (x => (x <= lv.L / 2 ? 0 : 1))
      : (x => (lv.hinges || []).filter(h => h < x - EPS).length);
    if (isArch) {
      B = 2; const r = lv.rises[st.rise || 0]; rise = r.h; cost += r.price;
      hin.push({ a: 0, b: 1, x: lv.L / 2, y: rise });
      if (st.tie) { const t = TIES[st.tie]; cost += t.price; ties.push({ a: 0, xa: 0, ya: 0, b: 1, xb: lv.L, yb: 0 }); }
    } else {
      (lv.hinges || []).forEach((h, i) => hin.push({ a: i, b: i + 1, x: h, y: 0 }));
      B = (lv.hinges || []).length + 1;
    }
    const addSup = (x, key, fixed) => {
      const p = PARTS[key]; if (!fixed) cost += p.price;
      sup.push({ b: bodyOf(x === lv.L && isArch ? lv.L : x), x, y: 0, t: p.t });
      supMeta.push({ x, key, p });
    };
    (lv.fixedSup || []).forEach(f => addSup(f.x, f.k, true));
    Object.keys(st.sup || {}).map(Number).sort((a, b) => a - b).forEach(x => addSup(x, st.sup[x], false));
    if (!sup.length) return { st: 'incomplete', why: 'nosup' };
    const Y = x => (isArch ? archY(lv, rise, x) : 0);
    (lv.cargo || []).forEach(c => loads.push({ b: bodyOf(c.x), x: c.x, y: Y(c.x), fx: 0, fy: -c.w }));
    (lv.dist || []).forEach(d => {
      const cuts = [d.x1].concat((lv.hinges || []).filter(h => h > d.x1 && h < d.x2), [d.x2]);
      for (let i = 0; i < cuts.length - 1; i++) {
        const a = cuts[i], b = cuts[i + 1], mid = (a + b) / 2;
        loads.push({ b: bodyOf(mid), x: mid, y: Y(mid), fx: 0, fy: -d.q * (b - a) });
      }
    });
    (lv.pulls || []).forEach(p => loads.push({ b: bodyOf(p.x), x: p.x, y: p.y != null ? p.y : Y(p.x), fx: p.fx, fy: p.fy }));
    Object.keys(st.top || {}).map(Number).forEach(x => {
      const t = TOPS[st.top[x]]; cost += t.price;
      loads.push({ b: bodyOf(x), x, y: Y(x), fx: 0, fy: -t.w });
    });
    const res = statics(B, sup, hin, ties, loads);
    const out = { cost, sup: supMeta, reac: [], fails: [], tie: null };
    if (res.st === 'indet') { out.st = 'indet'; return out; }
    if (res.st === 'mech') {
      out.st = 'fail';
      const hasH = sup.some(s => s.t !== 'R');
      out.fails.push({ kind: hasH ? 'mech' : 'slip' });
      return out;
    }
    supMeta.forEach(() => out.reac.push({ V: 0, H: 0, M: 0 }));
    res.cols.forEach((c, j) => {
      const v = Math.abs(res.x[j]) < 1e-9 ? 0 : res.x[j];
      if (c.k === 'V' || c.k === 'H' || c.k === 'M') out.reac[c.i][c.k] = v;
      if (c.k === 'T') out.tie = v;
    });
    out.reac.forEach((r, i) => {
      const p = supMeta[i].p, x = supMeta[i].x;
      if (r.V < -EPS) out.fails.push({ kind: 'uplift', i, x, val: -r.V });
      else if (r.V > p.cap + EPS) out.fails.push({ kind: 'crush', i, x, val: r.V, cap: p.cap });
      if (p.t !== 'R' && Math.abs(r.H) > p.hcap + EPS) out.fails.push({ kind: 'hpush', i, x, val: Math.abs(r.H), cap: p.hcap });
      if (p.t === 'F' && Math.abs(r.M) > p.mcap + EPS) out.fails.push({ kind: 'mcrush', i, x, val: Math.abs(r.M), cap: p.mcap });
    });
    if (st.tie && out.tie != null) {
      const t = TIES[st.tie];
      if (out.tie > t.cap + EPS) out.fails.push({ kind: 'tie', val: out.tie, cap: t.cap });
      else if (out.tie < -EPS) out.fails.push({ kind: 'tieC', val: -out.tie });
    }
    out.st = out.fails.length ? 'fail' : 'ok';
    return out;
  }

  // 列舉所有配置（給搜尋與提示用）
  function* enumA(lv) {
    const slots = lv.slots || [], tray = lv.tray || [];
    const topSlots = lv.topSlots || [], topTray = lv.topTray || [];
    const riseN = lv.type === 'arch' ? lv.rises.length : 1;
    const tieOpts = lv.type === 'arch' ? [null].concat(lv.ties || []) : [null];
    function* supAssign(i, left, cur) {
      if (i === slots.length) { yield Object.assign({}, cur); return; }
      yield* supAssign(i + 1, left, cur);
      for (const it of tray) {
        if ((left[it.k] || 0) > 0) {
          left[it.k]--; cur[slots[i]] = it.k;
          yield* supAssign(i + 1, left, cur);
          delete cur[slots[i]]; left[it.k]++;
        }
      }
    }
    function* topAssign(i, left, cur) {
      if (i === topSlots.length) { yield Object.assign({}, cur); return; }
      yield* topAssign(i + 1, left, cur);
      for (const it of topTray) {
        if ((left[it.k] || 0) > 0) {
          left[it.k]--; cur[topSlots[i]] = it.k;
          yield* topAssign(i + 1, left, cur);
          delete cur[topSlots[i]]; left[it.k]++;
        }
      }
    }
    const l0 = {}; tray.forEach(t => { l0[t.k] = t.n; });
    const t0 = {}; topTray.forEach(t => { t0[t.k] = t.n; });
    const tops = Array.from(topAssign(0, t0, {}));
    for (const s of supAssign(0, l0, {})) for (const tp of tops)
      for (let r = 0; r < riseN; r++) for (const tie of tieOpts) yield { sup: s, top: tp, rise: r, tie };
  }

  // ---------- 玩法 B：大跨度屋頂 ----------
  const FORMS = {
    beam:  { name: '梁', param: null },
    truss: { name: '桁架', param: '深度' },

  // ================= 玩法 B 場景 =================

    // 限制線
    const yu = ref - lv.up * s, yd = ref + lv.down * s;

    o += `<path d="M${BG.x1 - 22} ${yu}H${BG.x2 + 22}" stroke="${preUp ? C.bad : '#8a97a8'}" stroke-width="${preUp ? 1.6 : 1}" stroke-dasharray="5 4"/><text x="${BG.x2 + 22}" y="${yu - 3}" text-anchor="end" font-size="9.5" fill="${preUp ? C.bad : C.mute}">限高 ${lv.up} m</text>

    } else if (st.form === 'truss' || st.form === 'vier') {

      let p = `M${xa} ${y1}H${xb}M${xa} ${y2}H${xb}`;

    } else if (st.form === 'arch') {

      if (!an) o += `<path d="M180 ${ref + 2}V${ref + R - 4}" stroke="${C.mute}" stroke-width=".8" stroke-dasharray="3 3"/><text x="185" y="${ref + R / 2 + 3}" font-size="9" fill="${C.ink}">垂度 ${f} m</text>`;
    }
    // 載重與風
    if (an) {
      const a1 = ph(0, 0.35);
      for (let i = 1; i < 10; i++) { const u = i / 10, X = xa + span * u, Y = topY(u) - 5; o += `<path d="M${X} ${Y - 22 - (1 - a1) * 14}V${Y}" stroke="${C.load}" stroke-width="1.8" marker-end="url(#ah)" opacity="${a1}"/>`; }
      if (lv.wind) { const a2 = ph(0.35, 0.6); for (let i = 1; i < 8; i++) { const u = i / 8, X = xa + span * u, Y = topY(u) + 8; o += `<path d="M${X} ${Y + 24 + (1 - a2) * 10}V${Y}" stroke="${C.wind}" stroke-width="1.8" marker-end="url(#aw)" opacity="${a2}"/>`; } }

        const out = st.form === 'arch', k = ease(ph(0.35, 0.6)), bad = res.st === 'fail' && f0.kind !== 'wind';
        const lab = `${out ? '推力' : '拉力'} ${fmt(res.H * k)}／${res.resist} t`;
        const ar = (x, dir) => `<path d="M${x} ${ref + 14}h${dir * 15}" stroke="${bad ? C.bad : C.load}" stroke-width="2.6" marker-end="url(#ah)"/>`;
        if (!(st.form === 'arch' && st.tie)) o += out ? ar(xa - 15, -1) + ar(xb + 15, 1) : ar(xa - 31, 1) + ar(xb + 31, -1);

    if (!an) o += `<text x="180" y="${gd + 13}" text-anchor="middle" font-size="9" fill="${C.mute}">${st.form === 'beam' ? `梁深 ${fmt(lv.L / 20)} m（跨度的 1/20）` : ''}${res.pre.length ? (st.form === 'beam' ? '　' : '') + preText(res.pre[0]) : ''}</text>`;

  }
  function preText(p) { return p.kind === 'height' ? '超過限高，不能這樣蓋' : p.kind === 'clear' ? '佔到下方的淨空，不能這樣蓋' : '這裡不能有斜桿'; }

  function trayB() {

    const ic = { beam: '<rect x="3" y="10" width="30" height="6" fill="#2f3b4c"/>',

  function renderTray() { $('#tray').innerHTML = G.meta.mode === 'A' ? trayA() : trayB(); }

  // ---------- 操作 ----------
  function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
  function stepB(key, d) {
    const lv = G.lv, st = G.st;
    if (G.meta.mode === 'A') { if (key === 'rise') st.rise = clamp(st.rise + d, 0, lv.rises.length - 1); }
    else if (key === 'p') { const o = lv.opts[st.form], i = clamp(o.indexOf(st.p) + d, 0, o.length - 1); st.p = o[i]; }
    else if (key === 'tie') st.tie = clamp(st.tie + d, 0, E.TIE_B.length - 1);
    else if (key === 'anchor') st.anchor = clamp(st.anchor + d, 0, E.ANCHOR.length - 1);

  }

  // 拖曳（玩法 A）
  const VB = () => { const y = vbY(G.meta); return { y, h: 240 - y }; };
  function sceneX(clientX) { const r = $('#scene').getBoundingClientRect(), v = VB(); const sc = Math.min(r.width / 360, r.height / v.h); const ox = r.left + (r.width - 360 * sc) / 2; return (clientX - ox) / sc; }
  function sceneY(clientY) { const r = $('#scene').getBoundingClientRect(), v = VB(); const sc = Math.min(r.width / 360, r.height / v.h); const oy = r.top + (r.height - v.h * sc) / 2; return (clientY - oy) / sc + v.y; }
  function nearestSlot(kind, vx) {
    const lv = G.lv, g = geomA(lv), st = G.st;
    const list = kind === 'sup' ? (lv.slots || []).filter(x => st.sup[x] == null) : (lv.topSlots || []).filter(x => st.top[x] == null);
    let best = null, bd = 1e9;
    list.forEach(x => { const d = Math.abs(g.X(x) - vx); if (d < bd) { bd = d; best = x; } });
    return bd < Math.max(g.s * 0.9, 26) ? best : null;
  }
  function startDrag(kind, key, from, ev) {
    if (G.busy) return;
    G.drag = { kind, key, from, target: null, x0: ev.clientX, y0: ev.clientY, moved: false, id: ev.pointerId };
    const gh = $('#ghost'); gh.innerHTML = kind === 'sup' ? `${E.PARTS[key].name} ${E.PARTS[key].cap} t` : `${E.TOPS[key].name} ${E.TOPS[key].w} t`;
    moveDrag(ev);
  }
  function moveDrag(ev) {
    const d = G.drag; if (!d || ev.pointerId !== d.id) return;
    if (Math.hypot(ev.clientX - d.x0, ev.clientY - d.y0) > 7) d.moved = true;
    const trayTop = $('#tray').getBoundingClientRect().top, inStage = ev.clientY < trayTop + 6 || d.from != null;
    const tg = (d.moved || d.from != null) && inStage ? nearestSlot(d.kind, sceneX(ev.clientX)) : null;
    const gh = $('#ghost');
    if (d.moved && tg == null) { gh.style.display = 'block'; gh.style.left = ev.clientX + 'px'; gh.style.top = (ev.clientY - 44) + 'px'; } else gh.style.display = 'none';
    if (tg !== d.target) { d.target = tg; if (tg != null) sfx.tap(); renderScene(); }
  }
  function endDrag(ev) {
    const d = G.drag; if (!d || (ev && ev.pointerId !== d.id)) return;
    G.drag = null; $('#ghost').style.display = 'none';
    const map = d.kind === 'sup' ? G.st.sup : G.st.top;
    if (d.from != null && !d.moved) { sfx.remove(); }            // 點一下已放的零件：收回
    else if (d.target != null) { map[d.target] = d.key; sfx.place(); }
    else if (d.from != null) sfx.remove();
    renderScene(); renderLedger();
    setTimeout(renderTray, 40);   // 等手指事件收尾後再換掉卡片，避免下一次點擊失效
  }
  function hitDown(ev) {
    if (G.meta.mode !== 'A' || G.busy || G.anim) return;
    const lv = G.lv, g = geomA(lv), vx = sceneX(ev.clientX), vy = sceneY(ev.clientY), st = G.st;
    let pick = null;
    Object.keys(st.sup).map(Number).forEach(x => { if (Math.abs(g.X(x) - vx) < 15 && vy > g.supTop - 6 && vy < g.ground + 22) pick = { kind: 'sup', x }; });
    Object.keys(st.top).map(Number).forEach(x => { if (Math.abs(g.X(x) - vx) < 13 && vy > g.beamY - 32 && vy < g.beamY + 4) pick = { kind: 'top', x }; });
    if (!pick) return;
    ev.preventDefault();
    const map = pick.kind === 'sup' ? st.sup : st.top, key = map[pick.x];

    startDrag(pick.kind, key, pick.x, ev);
  }

  // ---------- 試載 ----------
  function go() {
    if (G.busy) return;
    const res = curEval();
    if (res.st === 'incomplete') return toast(res.why === 'cargo' ? '貨還沒全部放上去。' : '還沒放支承。');
    if (res.st === 'indet') return toast('約束太多了：這樣靜力算不出唯一的答案。先拿掉一個支承，或把一個鉸支承換成滾支承。');
    if (res.st === 'pre') return toast(preText(res.pre[0]) + '。');
    G.busy = true; sfx.go(); closeSheet();
    const t0 = performance.now(), dur = res.st === 'ok' ? 1500 : 1900;
    G.anim = { t: 0, res };
    let failed = false;
    (function frame(now) {
      const t = clamp((now - t0) / dur, 0, 1); G.anim.t = t; renderScene();
      if (!failed && res.st === 'fail' && t > 0.6) { failed = true; sfx.fail(); }
      if (t < 1) return requestAnimationFrame(frame);
      G.busy = false;
      if (res.st === 'ok') win(res); else lose(res);
    })(t0);
  }
  function failText(f, res) {
    const A = G.meta.mode === 'A';
    if (A) switch (f.kind) {
      case 'crush': return `${f.x} m 的支承被壓壞了：它要頂 <b>${fmt(f.val)} t</b>，上限只有 ${f.cap} t。`;
      case 'uplift': return `${f.x} m 的支承翹起來了：這裡要往下拉 <b>${fmt(f.val)} t</b> 才能平衡，但支承只能往上頂。`;
      case 'slip': return '梁滑走了：沒有任何東西擋水平方向。至少要有一個鉸支承。';
      case 'mech': return '結構會動：支承不夠，或擺的位置擋不住轉動。';
      case 'hpush': return `${f.x} m 的鉸支承被水平力推壞了：水平 <b>${fmt(f.val)} t</b>，上限 ${f.cap} t。`;
      case 'mcrush': return `牆上的固定端裂了：彎矩 <b>${fmt(f.val)} t·m</b>，上限 ${f.cap} t·m。`;
      case 'tie': return `拉桿被拉斷了：拉力 <b>${fmt(f.val)} t</b>，上限 ${f.cap} t。`;
      default: return '拉桿受壓，撐不住。';
    }
    switch (f.kind) {
      case 'thrust': return `拱腳往外推 <b>${fmt(f.val)} t</b>，兩側只擋得住 ${f.cap} t，牆被推開了。`;
      case 'tie': return `拉桿被拉斷了：拱的推力 <b>${fmt(f.val)} t</b>，拉桿上限 ${f.cap} t。`;
      case 'pull': return `纜索往內拉 <b>${fmt(f.val)} t</b>，兩側只擋得住 ${f.cap} t，被拉倒了。`;
      default: return `屋頂被風掀起來了：風每公尺往上 <b>${fmt(f.val)} t</b>，屋頂每公尺只有 ${fmt(f.cap)} t 重。`;
    }
  }
  function lose(res) {
    G.fails++; renderLedger();
    const m = G.meta, canSkip = G.fails >= 2 && !save.stars[m.lv.id] && m.i < ORDER[m.mode].length - 1;
    openSheet(`<div class="sheet fail"><h3>沒過</h3>${res.fails.slice(0, 2).map(f => `<p>${failText(f, res)}</p>`).join('')}
      <p class="fee">試載費 −$${m.testFee}</p>
      <div class="btns">${canSkip ? '<button class="ghost" data-act="skip">先跳過這關</button>' : ''}<button class="primary" data-act="retry">再調整</button></div></div>`);
  }
  function win(res) {
    const m = G.meta, pen = G.fails * m.testFee, profit = m.fee - res.cost - pen, s = starsFor(profit, m, G.hinted), A = m.mode === 'A';
    const prev = save.stars[m.lv.id] || 0;
    if (s > prev || (s === prev && profit > (save.profit[m.lv.id] || -1e9))) { save.stars[m.lv.id] = Math.max(s, prev); save.profit[m.lv.id] = Math.max(profit, save.profit[m.lv.id] || 0); persist(); }
    let forces = '';
    if (A) {
      forces = res.sup.map((sp, i) => { const r = res.reac[i], p = sp.p; return `<li>${sp.x} m ${p.name}：${p.t === 'F' ? `彎矩 ${fmt(Math.abs(r.M))}／${p.mcap} t·m、垂直 ${fmt(r.V)} t` : `垂直 ${fmt(r.V)}／${p.cap} t${Math.abs(r.H) > 1e-6 ? `、水平 ${fmt(Math.abs(r.H))}／${p.hcap} t` : ''}`}</li>`; }).join('');
      if (res.tie != null) forces += `<li>拉桿：拉力 ${fmt(res.tie)}／${E.TIES[G.st.tie].cap} t</li>`;
    } else {
      const st = G.st;
      forces = `<li>彎矩 w×L×L÷8 ＝ ${fmt(res.wt)}×${G.lv.L}×${G.lv.L}÷8 ＝ ${fmt(res.M)} t·m</li>`;
      if (st.form === 'arch' || st.form === 'cable') forces += `<li>${st.form === 'arch' ? '推力' : '拉力'} ＝ ${fmt(res.M)} ÷ ${st.p} ＝ ${fmt(res.H)} t（擋得住 ${res.resist} t）</li>`;
      else if (st.form !== 'beam') forces += `<li>上下弦受力 ＝ ${fmt(res.M)} ÷ ${st.p} ＝ ${fmt(res.chord)} t</li>`;
    }
    const best = profit >= m.fee - m.best - 1e-9, last = m.i >= ORDER[m.mode].length - 1;
    const why = s === 3 ? '這是最賺的做法。' : G.hinted && best ? '用了求救，最多兩星。' : !best && pen === 0 ? '可以過，但還有更省的做法。' : pen && res.cost <= m.best ? '配置是最省的，只是多付了試載費。' : '還有更省的做法，也少試幾次。';
    openSheet(`<div class="sheet win"><h3>驗收通過</h3><div class="stars">${[1, 2, 3].map(k => `<i data-k="${k}" class="${k <= s ? 'will' : ''}">★</i>`).join('')}</div>
      <table><tr><td>委託費</td><td>$${m.fee}</td></tr><tr><td>${A ? '零件' : '造價'}</td><td>−$${res.cost}</td></tr><tr><td>試載失敗 ${G.fails} 次</td><td>−$${pen}</td></tr><tr class="sum"><td>利潤</td><td>$${profit}</td></tr></table>
      <p class="why">${why}</p><details><summary>看這一關的力怎麼分配</summary><ul>${forces}</ul></details>
      <div class="btns"><button class="ghost" data-act="home">選單</button><button class="ghost" data-act="again">再玩一次</button>${last ? '' : '<button class="primary" data-act="next">下一關</button>'}</div></div>`);
    sfx.win();
    document.querySelectorAll('.stars i.will').forEach((el, i) => setTimeout(() => { el.classList.add('on'); sfx.star(i); }, 500 + i * 260));
  }
  function openSheet(html) { const el = $('#sheet'); el.innerHTML = html; el.classList.add('on'); }
  function closeSheet() { const el = $('#sheet'); el.classList.remove('on'); el.innerHTML = ''; }

  // ---------- 求救：往最省的做法走一步 ----------
  function hintStep() {
    const m = G.meta, sol = m.sol, st = G.st; G.hinted = true;
    if (m.mode === 'B') {
      if (st.form !== sol.form) { st.form = sol.form; st.p = defP(G.lv, sol.form); return `先看「${E.FORMS[sol.form].name}」。`; }
      if (st.form !== 'beam' && st.p !== sol.p) { st.p = sol.p; return `${E.FORMS[sol.form].param}調成 ${sol.p} m。`; }
      for (const k of ['tie', 'anchor', 'ballast', 'stab']) if ((st[k] || 0) !== (sol[k] || 0) && sol[k] !== undefined) { st[k] = sol[k]; return '幫你調了一個加裝的項目，看看估價和受力。'; }
      return '現在就是最省的做法，按試載吧。';
    }
    if (G.lv.type === 'arch' && st.rise !== sol.rise) { st.rise = sol.rise; return `拱高用 ${G.lv.rises[sol.rise].h} m。`; }
    if (G.lv.type === 'arch' && (st.tie || null) !== (sol.tie || null)) { st.tie = sol.tie || null; return sol.tie ? '這關要裝拉桿。' : '這關不用拉桿。'; }
    for (const kind of ['sup', 'top']) {
      const cur = st[kind], want = sol[kind] || {};
      for (const x of Object.keys(want)) if (cur[x] !== want[x]) {
        const tray = (kind === 'sup' ? G.lv.tray : G.lv.topTray).find(t => t.k === want[x]);
        const used = Object.keys(cur).filter(k => cur[k] === want[x]);
        if (used.length >= tray.n) { const wrong = used.find(k => want[k] !== want[x]); if (wrong != null) delete cur[wrong]; }
        cur[x] = want[x];
        return `${x} m 這裡放「${kind === 'sup' ? E.PARTS[want[x]].name + ' 上限 ' + E.PARTS[want[x]].cap + ' t' : E.TOPS[want[x]].name + ' ' + E.TOPS[want[x]].w + ' t'}」。`;
      }
      for (const x of Object.keys(cur)) if (want[x] == null) { delete cur[x]; return `${x} m 這個不需要，拿掉。`; }
    }
    return '現在就是最省的做法，放手吧。';
  }

  // ---------- 事件 ----------
  // 用 pointer 事件自己判斷「點一下」：拖曳剛結束時瀏覽器可能不送 click
  let tap = null;
  document.addEventListener('pointerdown', ev => { tap = { x: ev.clientX, y: ev.clientY, id: ev.pointerId, el: ev.target.closest('button, .card.tog') }; }, true);
  document.addEventListener('pointercancel', () => { tap = null; }, true);
  document.addEventListener('pointerup', ev => {
    const s = tap; tap = null;
    if (!s || !s.el || s.id !== ev.pointerId || Math.hypot(ev.clientX - s.x, ev.clientY - s.y) > 12) return;
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    if (el && s.el.contains(el) && document.contains(s.el)) onTap(s.el);
  }, true);
  function onTap(t) {
    if (t.id === 'mute') { save.mute = !save.mute; persist(); renderHome(); sfx.tap(); return; }
    if (t.classList.contains('lvbtn')) { sfx.tap(); return startLevel(t.dataset.id); }
    if (t.id === 'back') { sfx.tap(); return renderHome(); }
    if (G.busy) return;
    if (t.id === 'go') return go();
    if (t.id === 'reset') { sfx.remove(); const m = G.meta; if (m.mode === 'A') { G.st.sup = {}; G.st.top = {}; G.st.tie = null; } else { G.st.tie = 0; G.st.anchor = 0; G.st.stab = false; G.st.ballast = 0; } G.anim = null; return renderAll(); }
    if (t.id === 'hintBtn') { sfx.tap(); return openSheet(`<div class="sheet"><h3>求救</h3><p>我會往最省的做法幫你走一步。用了之後，這一關最多拿兩星。</p><div class="btns"><button class="ghost" data-act="close">不用了</button><button class="primary" data-act="hint">走一步</button></div></div>`); }
    if (t.dataset.step) { const [k, d] = t.dataset.step.split(':'); G.anim = null; return stepB(k, +d); }
    if (t.dataset.form) { G.st.form = t.dataset.form; G.st.p = defP(G.lv, G.st.form); G.anim = null; sfx.tap(); return renderAll(); }
    if (t.dataset.kind === 'tie') { G.st.tie = G.st.tie === t.dataset.key ? null : t.dataset.key; G.anim = null; sfx.place(); return renderAll(); }
    const act = t.dataset.act;
    if (act === 'retry' || act === 'close') { G.anim = null; closeSheet(); return renderAll(); }
    if (act === 'hint') { G.anim = null; const msg = hintStep(); closeSheet(); renderAll(); return toast(msg); }
    if (act === 'skip') { save.skip[G.meta.lv.id] = 1; persist(); return startLevel(ORDER[G.meta.mode][G.meta.i + 1]); }
    if (act === 'home') return renderHome();
    if (act === 'again') return startLevel(G.meta.lv.id);
    if (act === 'next') return startLevel(ORDER[G.meta.mode][G.meta.i + 1]);
  }
  document.addEventListener('pointerdown', ev => {
    if ($('#level').hidden || G.busy || G.meta.mode !== 'A') return;
    const card = ev.target.closest('.card');
    if (card && !card.classList.contains('tog')) {
      if (card.classList.contains('out')) return toast('這種零件用完了。');
      ev.preventDefault(); G.anim = null; closeSheet();
      return startDrag(card.dataset.kind, card.dataset.key, null, ev);
    }
    if (ev.target.id === 'hit') hitDown(ev);
  });
  window.addEventListener('pointermove', moveDrag, { passive: true });
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  G.api = { startLevel, go, renderAll, META, ORDER, save, starsFor };
  renderHome();
})();

</script>
</body>
</html>
